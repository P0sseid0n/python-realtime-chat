<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chat</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" />
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="app">
			<header>
				<h1>Chat Simples</h1>
				<div class="header-info">
					<span class="online-summary" id="online-summary" hidden></span>
					<div class="current-user" id="current-user" hidden>
						<span class="current-user-label">Você é</span>
						<strong class="current-user-name" id="current-user-name"></strong>
						<button type="button" class="link-button" id="change-username">Trocar</button>
					</div>
					<span class="status is-connecting" id="status" role="status" aria-live="polite">
						<span class="status-dot" aria-hidden="true"></span>
						<span class="status-spinner" aria-hidden="true"></span>
						<span class="status-text">Conectando...</span>
					</span>
				</div>
			</header>
			<div class="app-body">
				<div class="chat-column">
					<main class="chat" id="chat"></main>
					<p class="typing-indicator" id="typing-indicator" aria-live="polite"></p>
					<form id="composer" autocomplete="off">
						<input type="text" id="message" name="message" placeholder="Digite sua mensagem..." maxlength="2000" required />
						<button type="submit">Enviar</button>
					</form>
				</div>
				<aside class="online-panel" aria-labelledby="online-title">
					<h2 id="online-title">Online <span class="online-count" id="online-count">0</span></h2>
					<ul class="online-list" id="online-list"></ul>
				</aside>
			</div>
		</div>

		<dialog class="username-dialog" id="username-dialog" aria-labelledby="username-title">
			<form id="username-form" autocomplete="off">
				<h2 id="username-title">Como quer ser chamado?</h2>
				<p>Esse nome aparece para as outras pessoas no chat.</p>
				<input type="text" id="username" name="username" placeholder="Seu nome" maxlength="32" required />
				<span class="username-error" id="username-error" role="alert"></span>
				<div class="dialog-actions">
					<button type="button" class="secondary" id="username-cancel" hidden>Cancelar</button>
					<button type="submit" id="username-submit">Entrar no chat</button>
				</div>
			</form>
		</dialog>

		<script type="module" src="src/main.ts"></script>
	</body>
</html>
